services:
  - type: web
    name: amk-fashion-hub
    runtime: python
    buildCommand: pip install --prefer-binary --only-binary pyarrow -r requirements.txt && pip install . --no-deps
    startCommand: python -m streamlit run Main.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONIOENCODING
        value: utf-8
